name: Build and Release

on:
  push:
    paths:
      - '**.py'
      - '**.spec'
      - '**.ini'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Run manually, or if the commit message contains "[run ci]"
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: shapce shooter.exe
            asset_name: shapce-shooter-Windows
            separator: ";"
            icon: icon.ico
          - os: macos-latest
            artifact_name: shapce shooter
            asset_name: shapce-shooter-macOS
            separator: ":"
            icon: images/player.png
          - os: ubuntu-latest
            artifact_name: shapce shooter
            asset_name: shapce-shooter-Linux
            separator: ":"
            icon: images/player.png

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller pillow

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "shapce shooter" --icon="${{ matrix.icon }}" --add-data "images${{ matrix.separator }}images" --add-data "audio${{ matrix.separator }}audio" code/main.py

      - name: Zip Executable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          zip "../${{ matrix.asset_name }}.zip" "${{ matrix.artifact_name }}"

      - name: Zip Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "..\${{ matrix.asset_name }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:

          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: shapce shooter v${{ github.run_number }}
          files: ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
